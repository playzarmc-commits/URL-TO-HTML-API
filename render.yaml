services:
  - type: web
    name: url2html-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # ONE worker + many threads: the job table lives in this process.
    startCommand: gunicorn app:app --workers 1 --threads 32 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
